<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#090d1a">
  <!-- som app på hjemmeskærmen (iPad/Android) i fuld skærm -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Familietavle">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Familietavlen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=27">
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

  <div class="app">
    <nav class="rail" id="rail"></nav>
    <main>
      <header class="topbar">
        <div class="tb-left">
          <div class="greet" id="greet"></div>
          <div class="date" id="date"></div>
        </div>
        <div class="tb-right">
          <span class="ha-pill" id="ha-pill"></span>
          <div class="weather" id="weather"></div>
          <div class="clock" id="clock"></div>
        </div>
      </header>
      <section class="page" id="page-home"></section>
      <section class="page" id="page-kids"></section>
      <section class="page" id="page-plan"></section>
      <section class="page" id="page-shop"></section>
      <section class="page" id="page-media"></section>
      <section class="page" id="page-house"></section>
      <section class="page" id="page-cars"></section>
      <section class="page" id="page-parent"></section>
    </main>
  </div>

  <div class="saver" id="saver">
    <div class="sv-inner" id="sv-inner">
      <div class="sv-clock" id="sv-clock"></div>
      <div class="sv-date" id="sv-date"></div>
      <div class="sv-weather" id="sv-weather"></div>
      <div class="sv-kids" id="sv-kids"></div>
      <div class="sv-hint">Tryk for at vække</div>
    </div>
  </div>

  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="overlay-root"></div>
  <div id="toasts"></div>

  <script src="js/fx.js?v=27"></script>
  <script src="js/ha.js?v=27"></script>
  <script src="js/store.js?v=27"></script>
  <script src="js/app.js?v=27"></script>
  <script src="js/setup.js?v=27"></script>
</body>
</html>
